<!DOCTYPE html>
{% extends "index.html" %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-12 grid-margin stretch-card">
                <div class="card">
                  <div class="card-body">
                    <h4 class="card-title">Add Food Details here</h4>
                    <p class="card-description">Add Food Details here </p>
                    <form class="forms-sample" method="post" action="{% url 'save_food' %}">
                       {% csrf_token %}
                      <div class="form-group">
                        <label for="exampleInputName1">Food Name</label>
                        <input type="text" class="form-control" id="exampleInputName1" placeholder="Name" name="fname">
                      </div>
                      <div class="form-group">
                        <label for="exampleInputEmail3">Price</label>
                        <input type="number" class="form-control" id="exampleInputEmail3" placeholder="price" name="price">
                      </div>
                      <div class="form-group">
                        <label for="exampleInputPassword4">Quantity</label>
                        <input type="number" class="form-control" id="exampleInputPassword4" placeholder="quantity" name="quantity">
                      </div>



                      <div class="form-group">
                        <label for="exampleInputCity1">Description</label>
                        <textarea class="form-control" id="exampleInputCity1" placeholder="enter you text" name="description"></textarea>
                      </div>

                      <button type="submit" class="btn btn-primary mr-2">Submit</button>
                      <button class="btn btn-dark">Cancel</button>
                    </form>
                  </div>
                </div>
              </div>





</body>
</html>
{% endblock %}
